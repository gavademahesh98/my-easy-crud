apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: easycrud-ingress
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/gavademahesh98/my-easy-crud.git
    targetRevision: main
    path: k8s/ingress-application.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true