apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    selector:
      matchLabels:
        app: backend
    template:
      metadata:
        labels:
          app: backend
      spec:
        containers:
          - name: backend-cont
            image: tomcat:10
            ports:
              - containerPort: 8080
            imagePullPolicy: Always

            resources:
              requests:
                cpu: '100m'
                memory: '128Mi'
              limits:
                cpu: '200m'
                memory: '256Mi'
            